  features: "位于黄河边的济南新旧动能转换起步区，毗邻新建的济南博物馆和济南电视塔。需从起步区独有的黄河生态与新旧动能转换语境中提炼出特殊的线索，以防与济南市现存的省级科技馆产生功能与定位上的同质化重叠。这要求建筑空间不仅要符合现行规范，更需要在内部组织上具备极强的“呼吸式”弹性，以应对未来不可预知的科技展项更新。为谋求场馆在长周期运营中的财务健康，明确要求引入自我造血机制，需要将盈利性消费场景深度缝合进公益性科普动线中。"
